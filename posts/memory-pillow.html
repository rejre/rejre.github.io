<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>温柔回弹：托起肩颈的疲惫与安稳 · 风物志</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafaf7;--surface:#fff;--ink:#23221f;--soft:#6e6a61;--line:#e4e1d9;--bronze:#8a6d3b;--bronze-deep:#6f5627;--footer:#f1efe9}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif;line-height:1.9;font-size:17px}
a{color:inherit;text-decoration:none}
.topbar{max-width:1180px;margin:0 auto;padding:20px 26px;display:flex;align-items:center;justify-content:space-between}
.brand-en{letter-spacing:.42em;font-size:14px}
.topnav{display:flex;gap:30px;font-size:14.5px;letter-spacing:.14em;color:var(--soft)}
.topnav a:hover{color:var(--bronze-deep)}
.ph{background-size:cover;background-position:center;background-repeat:no-repeat}
.hero{position:relative;max-width:1180px;margin:6px auto 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);height:540px}
.hero-shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(250,250,247,.55) 0%,rgba(250,250,247,0) 62%)}
.hero-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:90%}
.hero-center .logo-img{width:104px;height:104px;object-fit:contain}
.hero-center h1{font-size:46px;font-weight:600;letter-spacing:.32em;text-indent:.32em;color:#2a2822;margin-top:6px;text-shadow:0 1px 6px rgba(255,255,255,.75)}
.hero-center .tag{font-size:14.5px;letter-spacing:.5em;text-indent:.5em;color:#4c473e;margin-top:4px;text-shadow:0 1px 4px rgba(255,255,255,.8)}
.hero-center .btn{display:inline-block;margin-top:22px;background:var(--bronze);color:#fff;font-size:14.5px;letter-spacing:.3em;text-indent:.3em;padding:9px 30px;border-radius:999px}
.hero-center .btn:hover{background:var(--bronze-deep)}
main{max-width:1180px;margin:0 auto;padding:0 26px}
.sec-head{text-align:center;padding:62px 0 30px}
.sec-head .en{font-size:12px;letter-spacing:.5em;text-indent:.5em;color:var(--bronze)}
.sec-head .zh{font-size:24px;font-weight:600;letter-spacing:.18em;margin-top:8px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center;padding-bottom:26px}
.cat .pic{height:190px}
.cat h3{font-size:19px;font-weight:600;letter-spacing:.22em;margin-top:20px}
.cat p{color:var(--soft);font-size:14.5px;margin:8px 22px 0;line-height:1.8}
.posts{display:flex;flex-direction:column;gap:22px;padding-bottom:6px}
.post{display:flex;gap:28px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;align-items:center}
.post .thumb{flex:0 0 250px;height:158px;border-radius:6px;border:1px solid var(--line)}
.post .chip{display:inline-block;font-size:12.5px;letter-spacing:.24em;color:var(--bronze-deep);border:1px solid var(--bronze);border-radius:999px;padding:1px 12px}
.post h3{font-size:21px;font-weight:600;line-height:1.55;margin-top:10px}
.post a:hover h3{color:var(--bronze-deep)}
.post p{color:var(--soft);font-size:15px;margin-top:8px;line-height:1.85}
.post .meta{color:#a09a8d;font-size:13px;letter-spacing:.12em;margin-top:10px}
.more-wrap{text-align:center;padding:28px 0 4px}
.more-btn{display:inline-block;border:1px solid var(--bronze);color:var(--bronze-deep);font-size:14.5px;letter-spacing:.3em;text-indent:.3em;padding:9px 34px;border-radius:999px}
.more-btn:hover{background:var(--bronze);color:#fff}
footer{background:var(--footer);border-top:1px solid var(--line);margin-top:70px}
.foot{max-width:1180px;margin:0 auto;padding:46px 26px 30px;display:flex;gap:40px;flex-wrap:wrap;justify-content:space-between}
.foot .fbrand{display:flex;gap:16px;align-items:flex-start}
.foot .flogo-img{width:52px;height:52px;object-fit:contain}
.foot .fname{font-size:21px;font-weight:600;letter-spacing:.3em}
.foot .ftag{color:var(--soft);font-size:13px;letter-spacing:.2em;margin-top:2px}
.foot h4{font-size:13px;letter-spacing:.34em;color:var(--bronze-deep);margin-bottom:12px;font-weight:600}
.foot .flinks{display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--soft)}
.socials{display:flex;gap:12px}
.soc{width:42px;height:42px;border:1px solid var(--bronze);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bronze-deep)}
.soc:hover{background:var(--bronze);color:#fff}
.soc svg{width:19px;height:19px}
.copyright{max-width:1180px;margin:0 auto;padding:0 26px 30px;color:#a09a8d;font-size:12.5px;letter-spacing:.14em}
.article-wrap{max-width:760px;margin:0 auto;padding:52px 26px 10px}
.article-wrap .chip{display:inline-block;font-size:12.5px;letter-spacing:.24em;color:var(--bronze-deep);border:1px solid var(--bronze);border-radius:999px;padding:1px 12px}
.article-wrap h1{font-size:28px;line-height:1.55;font-weight:600;margin:16px 0 10px}
.article-wrap .meta{color:#a09a8d;font-size:13.5px;letter-spacing:.12em;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:30px}
.article-wrap .post-img{width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:28px;display:block}
.article-wrap h2{font-size:20px;font-weight:600;margin:34px 0 12px}
.article-wrap p{margin-bottom:16px}
.article-wrap hr{border:none;border-top:1px solid var(--line);margin:34px 0}
.back{display:inline-block;margin-top:10px;color:var(--bronze-deep);font-size:15px;letter-spacing:.1em}
.page-head{max-width:1180px;margin:0 auto;padding:54px 26px 6px;text-align:center}
.page-head .en{font-size:12px;letter-spacing:.5em;text-indent:.5em;color:var(--bronze)}
.page-head .zh{font-size:26px;font-weight:600;letter-spacing:.18em;margin-top:8px}
.list-wrap{max-width:1180px;margin:0 auto;padding:26px}
@media (max-width:760px){.cats{grid-template-columns:1fr}.post{flex-direction:column;align-items:stretch}.post .thumb{flex:none}.hero{height:420px}.hero-center h1{font-size:34px}.topnav{gap:16px}}</style>
</head>
